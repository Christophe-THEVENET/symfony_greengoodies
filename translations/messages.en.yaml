    story:
        eyebrow: Our story
        title: One shop, one conviction.
        text: "It all began in 2019, in the Croix-Rousse district. Aurélie opened a small shop with a simple idea: proving that we can consume better without giving up beauty or pleasure."
        quote: "“Every product must stand up to scrutiny: its origin, its material, its end of life.”"
        founder: Founder
        badge: Lyon since 2019
    values:
        durability_title: Durability
        durability_text: Products chosen to last, refillable and repairable, that respect the environment at every step.
        ethics_title: Ethics
        ethics_text: We work with partners who share our values and pay fairly. Short supply chain, full traceability.
        ecology_title: Ecology
        ecology_text: Practices that respect the ecosystem, eco-friendly materials and carbon-neutral logistics.
    testi:
        eyebrow: They trust us
        title: What they say
        q1: "“The lavender & patchouli candle fills the whole house without any chemical smell.”"
        q2: "“Finally a shop where I can buy with my eyes closed. Everything is beautiful and well thought out.”"
        q3: "“The make-up remover pads replaced hundreds of cotton ones. Real impact.”"
        q4: "“The eucalyptus soap lasts 3 times longer than my old shower gels.”"
        q5: "“Fast delivery and 100% compostable packaging. Special mention for the handwritten note.”"
        q6: "“I've been refilling my containers for 2 years. Zero plastic, zero regrets.”"
    news:
        eyebrow: Newsletter
        title: Join the movement.
        text: Zero-waste tips, new arrivals and stories from our makers — one letter a month, never more.
