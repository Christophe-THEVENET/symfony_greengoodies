"Thé, Orange & Girofle": Tea, orange & clove

# ===== Long descriptions =====
"Ce kit d’hygiène recyclable est conçu pour celles et ceux qui souhaitent allier bien-être et respect de l’environnement. Il contient l’essentiel pour une routine quotidienne complète, sans compromis sur la qualité ni sur la planète. Chaque élément du kit est fabriqué à partir de matériaux durables, recyclables ou biodégradables, afin de limiter au maximum l'empreinte écologique. Que ce soit pour une utilisation personnelle, en voyage ou en cadeau responsable, ce kit est idéal pour amorcer une transition vers une consommation plus consciente. Il s'inscrit parfaitement dans une démarche zéro déchet, en remplaçant les produits jetables par des alternatives durables et réutilisables.": "This recyclable hygiene kit is designed for those who want to combine well-being with environmental respect. It contains everything you need for a complete daily routine, without compromising on quality or the planet. Each item in the kit is made from durable, recyclable or biodegradable materials, to minimize the ecological footprint. Whether for personal use, travel or as a responsible gift, this kit is ideal for starting a transition to more conscious consumption. It fits perfectly into a zero-waste approach, replacing disposable products with sustainable, reusable alternatives."
"Offrez-vous un concentré d’énergie naturelle avec notre shot tropical pressé à froid, élaboré à partir de fruits frais issus de l’agriculture responsable. Mangue, ananas, passion et citron vert sont pressés à froid pour préserver un maximum de nutriments sans recourir à la chaleur ni à aucun additif. Conditionné dans un flacon en verre recyclable, ce shot s’inscrit dans une démarche durable et zéro plastique. Idéal pour soutenir votre système immunitaire tout en réduisant votre impact environnemental, il allie plaisir gustatif et conscience écologique.": "Treat yourself to a burst of natural energy with our cold-pressed tropical shot, made from fresh fruit from responsible farming. Mango, pineapple, passion fruit and lime are cold-pressed to preserve maximum nutrients without heat or additives. Packaged in a recyclable glass bottle, this shot is part of a sustainable, plastic-free approach. Ideal for supporting your immune system while reducing your environmental impact, it combines taste pleasure with ecological awareness."
"Alliez élégance et conscience écologique avec cette gourde en bois durable. Fabriquée à partir de bois issu de forêts gérées durablement, elle est doublée d’un contenant inox pour garantir une parfaite étanchéité et une conservation optimale des boissons chaudes ou froides. Sa conception sans plastique, réutilisable à l’infini, en fait une alternative idéale aux bouteilles jetables. Solide, stylée et responsable, cette gourde s’adresse à celles et ceux qui veulent consommer autrement, avec respect pour la nature à chaque gorgée.": "Combine elegance with ecological awareness with this sustainable wooden bottle. Made from wood from sustainably managed forests, it is lined with a stainless steel container to ensure perfect sealing and optimal storage of hot or cold drinks. Its plastic-free, endlessly reusable design makes it an ideal alternative to disposable bottles. Sturdy, stylish and responsible, this bottle is for those who want to consume differently, with respect for nature in every sip."
"Fini les cotons jetables ! Optez pour une routine beauté plus responsable avec ces disques démaquillants lavables et réutilisables. Fabriqués en coton bio ou en bambou certifié, ils sont ultra-doux pour la peau, même la plus sensible, tout en respectant l’environnement. Lavables en machine, ils remplacent des centaines de cotons à usage unique et s’inscrivent parfaitement dans une démarche zéro déchet. Un petit geste au quotidien, pour un grand impact sur la planète.": "No more disposable cotton pads! Switch to a more responsible beauty routine with these washable and reusable makeup remover pads. Made from organic cotton or certified bamboo, they are ultra-gentle on the skin, even the most sensitive, while respecting the environment. Machine washable, they replace hundreds of single-use cotton pads and fit perfectly into a zero-waste approach. A small daily gesture for a big impact on the planet."
"Laissez-vous envelopper par l’harmonie apaisante de la lavande et la profondeur boisée du patchouli avec cette bougie naturelle, coulée à la main. Composée de cire végétale 100 % naturelle (soja ou colza), d'une mèche en coton non traité et d’huiles essentielles biologiques, elle ne dégage aucune substance toxique. Son contenant en verre recyclable ou réutilisable renforce sa dimension écoresponsable. Idéale pour créer une ambiance relaxante, cette bougie s’inscrit dans une consommation douce, durable et respectueuse de l’environnement.": "Let yourself be enveloped by the soothing harmony of lavender and the woody depth of patchouli with this hand-poured natural candle. Made from 100% natural plant wax (soy or rapeseed), an untreated cotton wick and organic essential oils, it releases no toxic substances. Its recyclable or reusable glass container reinforces its eco-responsible dimension. Ideal for creating a relaxing atmosphere, this candle is part of a gentle, sustainable and environmentally friendly consumption."
"Remplacez le plastique de votre salle de bain avec cette brosse à dents en bois naturelle, conçue pour limiter votre impact environnemental sans compromettre votre hygiène bucco-dentaire. Son manche est fabriqué en bois de bambou 100 % biodégradable, issu de forêts gérées durablement, et ses poils doux sans BPA assurent un brossage efficace tout en respectant vos gencives. Une alternative simple et responsable pour réduire vos déchets au quotidien.": "Replace plastic in your bathroom with this natural wood toothbrush, designed to limit your environmental impact without compromising your oral hygiene. Its handle is made from 100% biodegradable bamboo wood, from sustainably managed forests, and its soft BPA-free bristles ensure effective brushing while respecting your gums. A simple and responsible alternative to reduce your daily waste."
"Emportez vos couverts partout avec ce kit en bois d’olivier, comprenant une fourchette, un couteau et une cuillère, le tout présenté dans un élégant sac de transport. Idéal pour les pique-niques, les repas en extérieur ou au bureau, ce kit est une alternative durable aux couverts jetables. Chaque pièce est soigneusement fabriquée à partir de bois d’olivier, connu pour sa durabilité et sa résistance à l’eau. Un choix écoresponsable pour réduire vos déchets au quotidien.": "Take your cutlery everywhere with this olive wood kit, including a fork, a knife and a spoon, all presented in an elegant carrying pouch. Ideal for picnics, outdoor meals or at the office, this kit is a sustainable alternative to disposable cutlery. Each piece is carefully crafted from olive wood, known for its durability and water resistance. An eco-responsible choice to reduce your daily waste."
"Ce déodorant bio à l’eucalyptus offre une protection efficace tout en respectant votre peau. Sa formule naturelle, sans sels d’aluminium ni parabènes, garantit une sensation de fraîcheur durable. Enrichi en huiles essentielles, il laisse un parfum agréable et subtil. Son format de 50ml est idéal pour une utilisation quotidienne et se glisse facilement dans votre trousse de toilette. Optez pour une hygiène responsable avec ce déodorant respectueux de l’environnement.": "This organic eucalyptus deodorant offers effective protection while respecting your skin. Its natural formula, free from aluminium salts and parabens, guarantees a lasting feeling of freshness. Enriched with essential oils, it leaves a pleasant and subtle scent. Its 50ml format is ideal for daily use and easily slips into your toiletry bag. Choose responsible hygiene with this environmentally friendly deodorant."
"Savon bio artisanal, fabriqué à partir d'ingrédients naturels et d'huiles essentielles. Ce savon doux et parfumé nettoie la peau en profondeur tout en respectant son équilibre naturel. Idéal pour tous les types de peau, il laisse une sensation de fraîcheur et de bien-être. Un choix écoresponsable pour votre routine de soins.": "Artisanal organic soap, made from natural ingredients and essential oils. This gentle, fragrant soap deeply cleanses the skin while respecting its natural balance. Ideal for all skin types, it leaves a feeling of freshness and well-being. An eco-responsible choice for your skincare routine."
