"Gourde en bois": Wooden bottle
"50cl, bois d'olivier": "50 cl, olive wood"
"Disques Démaquillants x3": Cleansing pads ×3
"Solution efficace pour vous démaquiller en douceur ": Gentle, reusable makeup removal
"Bougie Lavande & Patchouli": Lavender & Patchouli candle
"Cire naturelle": Natural wax
"Brosse à dent": Toothbrush
"Bois de hêtre rouge issu de forêts gérées durablement": Sustainably sourced beech wood
"Kit couvert en bois": Wooden cutlery kit
"Revêtement Bio en olivier & sac de transport": Olive wood & carry pouch
"Nécessaire, déodorant Bio": Organic deodorant set
