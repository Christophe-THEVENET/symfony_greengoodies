        eyebrow: La sélection
        title: Nos produits
        intro: Neuf essentiels choisis pour leur qualité, leur durabilité et leur juste fabrication.
    story:
        eyebrow: Notre histoire
        title: Une boutique, une conviction.
        text: "Tout commence en 2019, à la Croix-Rousse. Aurélie ouvre une petite boutique avec une idée simple : prouver qu'on peut consommer mieux sans renoncer au beau ni au plaisir."
        quote: "« Chaque produit doit pouvoir être regardé en face : son origine, sa matière, sa fin de vie. »"
        founder: Fondatrice
        badge: Lyon depuis 2019
    values:
        durability_title: Durabilité
        durability_text: Des produits choisis pour durer, rechargeables et réparables, qui respectent l'environnement à chaque étape.
        ethics_title: Éthique
        ethics_text: Nous travaillons avec des partenaires qui partagent nos valeurs et rémunèrent justement. Circuit court, traçabilité totale.
        ecology_title: Écologie
        ecology_text: Des pratiques respectueuses de l'écosystème, des matériaux écologiques et une logistique neutre en carbone.
    testi:
        eyebrow: Elles & ils nous font confiance
        title: Ce qu'on en dit
        q1: « La bougie lavande & patchouli embaume toute la maison sans odeur chimique. »
        q2: « Enfin une boutique où je peux acheter les yeux fermés. Tout est beau et bien pensé. »
        q3: « Les disques démaquillants ont remplacé des centaines de cotons. Vrai impact. »
        q4: « Le savon à l'eucalyptus dure 3 fois plus longtemps que mes anciens gels douche. »
        q5: « Livraison rapide et emballage 100% compostable. Mention spéciale pour le petit mot manuscrit. »
        q6: « Je recharge mes contenants depuis 2 ans. Zéro plastique, zéro regret. »
    news:
        eyebrow: Newsletter
