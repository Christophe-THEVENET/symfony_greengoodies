# Pas de version de nginx dans l'en-tête Server ni dans les pages d'erreur
server_tokens off;

server {
    listen 80;
    server_name greengoodies.eu www.greengoodies.eu;

    # Challenge Let's Encrypt (certbot --webroot) servi en HTTP, sans dépendre du bloc HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name greengoodies.eu www.greengoodies.eu;

    ssl_certificate /etc/letsencrypt/live/greengoodies.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greengoodies.eu/privkey.pem;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
