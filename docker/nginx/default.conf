# Pas de version de nginx dans l'en-tête Server ni dans les pages d'erreur
server_tokens off;

# Le trafic arrive uniquement par Caddy (réseau Docker « edge », point d'entrée du VPS),
# qui gère le HTTPS, les certificats et la redirection HTTP → HTTPS.
# Vraie IP du visiteur : celle transmise par Caddy, crue seulement depuis ce réseau.
set_real_ip_from 172.30.0.0/24;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name greengoodies.eu www.greengoodies.eu;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Caddy a reçu la requête en HTTPS : Symfony doit le savoir (URL absolues, cookies sécurisés)
        fastcgi_param HTTPS on;
    }
}
